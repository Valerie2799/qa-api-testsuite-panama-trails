name: QA API Test Suite - Senderos Panama

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  api-tests:
    name: Run Pytest Suite against Open-Meteo
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API Tests with Pytest
        run: |
          pytest tests/ -v --durations=10 --reruns 3 --reruns-delay 10 --only-rerun "ReadTimeout|ConnectionError"
